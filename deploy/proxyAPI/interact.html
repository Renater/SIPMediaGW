<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIPMediaGW Remote Control</title>
<link rel="stylesheet" href="/interact/static/shared.css">
<link rel="stylesheet" href="/interact/static/interact-connexion.css">
<link rel="stylesheet" href="/interact/static/interact-controls.css">
</head>
<body>
<div class="wrap">

  <header class="brand">
    <img id="brand-logo" class="brand__logo" src="" alt="">
    <div>
      <div class="brand__name" id="brand-name"></div>
      <div class="brand__tagline" id="brand-tagline"></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="segmented" role="radiogroup" aria-label="Langue">
      <button type="button" class="segmented__el" id="lang-fr" role="radio">FR</button>
      <button type="button" class="segmented__el" id="lang-en" role="radio">EN</button>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false"></button>
  </div>

  <!-- Which room this page drives, so the visitor can tell they reached the
       right one. Filled from the first status poll. -->
  <section class="room room--pending" id="room" aria-live="polite">
    <div><span class="room__label" id="room-name-label"></span>
         <span class="room__value" id="room-name"></span></div>
    <div><span class="room__label" id="room-uri-label"></span>
         <span class="room__value" id="room-uri"></span></div>
  </section>

  <h1 id="title"><span id="title-text"></span></h1>

  <!-- Screen 1: pick a platform -->
  <section id="screen-platforms" hidden>
    <p class="subtitle" id="platforms-subtitle"></p>
    <p class="waiting" id="waiting" hidden aria-live="polite"></p>
    <div class="platforms" id="platforms"></div>
  </section>

  <!-- Screen 2: enter the meeting id. No way back: once a platform is picked
       the gateway cannot return to its menu, so offering the move would only
       take the page out of step with the room. -->
  <section id="screen-meeting" hidden>
    <!-- Which platform is being joined, said once above the field rather than
         hung off the title. -->
    <p class="chosen" id="chosen">
      <img class="chosen__icon" id="chosen-icon" src="" alt="">
      <span class="chosen__name" id="chosen-name"></span>
    </p>

    <div class="field">
      <label class="field__label" for="key-capture" id="meeting-label"></label>
      <input id="key-capture" autocomplete="off" autocapitalize="none"
             autocorrect="off" spellcheck="false" inputmode="text">
      <p class="field__hint" id="room-name-hint" aria-live="polite"></p>
    </div>

    <button type="button" class="submit" id="btn-enter" disabled>
      <span class="spinner" id="spinner" hidden aria-hidden="true"></span>
      <span id="btn-enter-label"></span>
    </button>
  </section>

  <!-- Leaving is available on every screen, but as a secondary action at the
       foot of the page: reaching the wrong room is worth correcting, it is not
       what the visitor came to do. -->
  <button type="button" class="hangup" id="btn-endcall"></button>

  <!-- Hang-up confirmation. In the page rather than a browser confirm(), so it
       sits in the middle of the screen and carries the same styling as the
       rest. -->
  <div class="modal" id="confirm" hidden>
    <div class="modal__backdrop" id="confirm-backdrop"></div>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal__head">
        <span class="modal__title" id="confirm-title"></span>
        <button type="button" class="modal__close" id="confirm-close">&times;</button>
      </div>
      <div class="modal__body">
        <svg class="modal__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 9a17 17 0 0 0-11 4.2 2 2 0 0 0 0 2.9l2 2a1 1 0 0 0 1.3.1l2.8-2a1 1 0 0 0 .4-1.1l-.5-1.8A13 13 0 0 1 12 12a13 13 0 0 1 5 1.3l-.5 1.8a1 1 0 0 0 .4 1.1l2.8 2a1 1 0 0 0 1.3-.1l2-2a2 2 0 0 0 0-2.9A17 17 0 0 0 12 9z"/>
        </svg>
        <p id="confirm-body"></p>
      </div>
      <div class="modal__actions">
        <button type="button" class="modal__btn" id="confirm-no"></button>
        <button type="button" class="modal__btn modal__btn--danger" id="confirm-yes"></button>
      </div>
    </div>
  </div>

  <div id="status">Ready</div>
  <div id="menu-options"></div>

  <!-- Slide controls and gallery (placed under the menu so always visible with options) -->
  <div id="slide-controls" aria-hidden="false">
    <div class="controls-row">
      <button id="btn-slideShot" type="button" class="key" tabindex="-1"
              title="Capture slide" aria-label="Capture slide">Capture</button>
      <div id="slide-hint" style="font-size:12px;color:#666;">Thumbnails appear here</div>
    </div>
    <div id="slide-gallery" aria-live="polite"></div>
  </div>

  <div id="log">Waiting for input...</div>
</div>

<!-- Slide backdrop + preview modal -->
<div id="slide-backdrop" aria-hidden="true"></div>
<div id="slide-preview" aria-hidden="true">
    <div class="preview-actions">
      <a id="slide-download" class="key small" href="#" download="slide.png">Download</a>
      <button id="slide-fullscreen" class="key small" title="Fullscreen">Full screen</button>
      <button id="slide-discard" class="key small" title="Discard">Discard</button>
      <button id="slide-close" class="key small">Close</button>
    </div>
    <img id="slide-img" src="" alt="Slide capture">
  </div>

<script src="/interact/static/interact.js" defer></script>
</body>
</html>
