networks:
  default:
    name: gw_net
    external: true

services:
  gw:
    image: "${DOCKER_IMAGE}"
    build:
      context: .
      args:
        GW_VERSION: ${GW_VERSION:-dev}
        ALLOW_DEV_BUILD: ${ALLOW_DEV_BUILD:-1}
    container_name: gw${ID}
    networks:
      default:
        aliases:
          - "${ROOM}"
    # chromedriver drives the call's browser: only HTTPLauncher, on this
    # host, talks to it. Published on every interface it let any machine
    # that reached the port run JavaScript in the conference.
    ports:
      - 127.0.0.1:951${ID}:9515
    # PID 1 of the container is event_handler.py (exec in entrypoint.sh),
    # which never reaps the orphans it inherits: the processes a browser
    # leaves behind stay as zombies and count against the pids limit until
    # nothing in the container can fork. tini as PID 1 reaps them.
    init: true
    tmpfs:
      - /tmp
    volumes:
      - ./logs:/var/logs
    devices:
      - /dev/${VIDEO_DEV}:/dev/video0
      - /dev/snd:/dev/snd
    shm_size: '2gb'
    logging:
      driver: syslog
      options:
        tag: "{{.ImageName}}/{{.Name}}"
    env_file:
      - .env
      - ./deploy/kamailio/config/.env_cred
      - ./deploy/coturn/.env_cred
    stop_grace_period: 20s
