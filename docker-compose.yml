networks:
  default:
    name: gw_net
    external: true

services:
  gw:
    image: "${DOCKER_IMAGE}"
    build:
      context: .
      args:
        # A local build says nothing and gets `dev`; a release build exports
        # GW_VERSION first:
        #   GW_VERSION=$(git describe --tags --always --dirty) docker compose build
        GW_VERSION: ${GW_VERSION:-dev}
        # The guard in the Dockerfile refuses `dev` unless this is set. Defaulted
        # here so the lab builds without ceremony — which means the guard only
        # bites where it is deliberately unset, and a release pipeline must
        # export ALLOW_DEV_BUILD=0 for it to bite at all.
        ALLOW_DEV_BUILD: ${ALLOW_DEV_BUILD:-1}
    container_name: gw${ID}
    networks:
      default:
        aliases:
          - "${ROOM}"
    ports:
      - 951${ID}:9515
    tmpfs:
      - /tmp
    volumes:
      - ./logs:/var/logs
    devices:
      - /dev/${VIDEO_DEV}:/dev/video0
      - /dev/snd:/dev/snd
    shm_size: '2gb'
    logging:
      driver: syslog
      options:
        tag: "{{.ImageName}}/{{.Name}}"
    env_file:
      - .env
      - ./deploy/kamailio/config/.env_cred
      - ./deploy/coturn/.env_cred
    stop_grace_period: 20s
